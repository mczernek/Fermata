android {
    namespace = "me.aap.fermata.addon.web"
    defaultConfig {
        versionCode 1
        versionName "1.0"
    }
}

ext {
    addons = [
            [
                    name : 'youtube',
                    icon : 'youtube',
                    class: 'me.aap.fermata.addon.web.yt.YoutubeAddon',
                    order: 2
            ],
            [
                    name : 'disney',
                    icon : 'disney',
                    class: 'me.aap.fermata.addon.web.disney.DisneyAddon',
                    order: 3
            ],
            [
                    name : 'canal_plus',
                    icon : 'canal_plus',
                    class: 'me.aap.fermata.addon.web.canal.CanalPlusAddon',
                    order: 4
            ],
            [
                    name : 'tvp_vod',
                    icon : 'tvp_vod',
                    class: 'me.aap.fermata.addon.web.tvp.TvpVodAddon',
                    order: 5
            ],
            [
                    name : 'player_pl',
                    icon : 'player_pl',
                    class: 'me.aap.fermata.addon.web.player.PlayerPlAddon',
                    order: 6
            ],
            [
                    name : 'prime_video',
                    icon : 'prime_video',
                    class: 'me.aap.fermata.addon.web.prime.PrimeVideoAddon',
